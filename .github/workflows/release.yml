name: release

# Publica uma versão do Analista Hub no canal de atualização.
#
# O app consulta uma vez por dia:
#   https://github.com/<owner>/<repo>/releases/latest/download/latest.json
# então cada release precisa dos assets: latest.json + AnalistaHub-<versao>-win-x64.zip.
#
# Como disparar: empurre uma tag. `git tag v0.2.0 && git push origin v0.2.0`
# (o workflow_dispatch serve para republicar uma versão já existente).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 0.2.0) — precisa existir como tag v<versao>'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolver versão e tag
        id: v
        shell: pwsh
        run: |
          $raw = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $version = $raw.Trim().TrimStart('v','V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "versao invalida: $raw" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "versao=$version tag=v$version"

      - name: Publicar e empacotar
        shell: pwsh
        # Os scripts das ferramentas vivem no repositório (tools/), então o gate do CI valida a
        # existência deles também — nada de -SkipScripts aqui.
        run: ./build/package-release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Conferir o pacote (mesma checagem que o app faz)
        shell: pwsh
        run: |
          $json = Get-Content dist/release/latest.json -Raw | ConvertFrom-Json
          $asset = $json.assets.'win-x64'
          $zip = Join-Path 'dist/release' (Split-Path $asset.url -Leaf)
          if (-not (Test-Path $zip)) { throw "asset nao encontrado: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $asset.sha256) { throw "sha256 do manifesto nao confere" }
          if ((Get-Item $zip).Length -ne $asset.size) { throw "tamanho do manifesto nao confere" }
          Write-Host "ok: $($json.version) · $([math]::Round($asset.size/1MB,1)) MB · $hash"

      - name: Gerar o instalador (.exe)
        shell: pwsh
        # O Setup é gerado DEPOIS do zip: ele recebe a url/sha256/size do manifesto recém-gerado, então
        # instala exatamente o pacote desta release e continua verificando o hash na instalação.
        run: |
          $json = Get-Content dist/release/latest.json -Raw | ConvertFrom-Json
          $asset = $json.assets.'win-x64'
          ./build/build-installer.ps1 -Version $json.version `
            -ChannelUrl "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" `
            -AssetUrl $asset.url -Sha256 $asset.sha256 -Size $asset.size
          if (-not (Test-Path "dist/setup/AnalistaHub-Setup-$($json.version).exe")) { throw "instalador nao gerado" }

      - name: Criar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.v.outputs.tag }}'
          gh release view $tag --repo '${{ github.repository }}' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag já existe — removendo para republicar"
            gh release delete $tag --repo '${{ github.repository }}' --yes
          }
          # o Setup viaja como asset SEPARADO: o updater nunca o baixa como payload
          gh release create $tag `
            (Get-Item dist/release/*.zip).FullName `
            dist/release/latest.json `
            (Get-Item dist/release/*.sha256).FullName `
            (Get-Item dist/setup/*.exe).FullName `
            (Get-Item dist/setup/*.sha256).FullName `
            --repo '${{ github.repository }}' `
            --title "Analista Hub $tag" `
            --notes-file dist/release/notas.md `
            --latest
